<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実在研究所 — 科学・哲学ニュース</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: #0a0a0f; color: #e8e6f0; min-height: 100vh; }
  
  header { border-bottom: 0.5px solid #2a2840; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(10,10,15,0.92); backdrop-filter: blur(12px); z-index: 100; }
  .logo { font-size: 13px; letter-spacing: 0.15em; color: #7b6ef6; font-weight: 500; text-transform: uppercase; }
  .logo span { color: #e8e6f0; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 12px; color: #6b6880; }

  .controls { padding: 1.25rem 2rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 0.5px solid #1a1828; }
  .tag-filter { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { padding: 4px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; border: 0.5px solid #2a2840; color: #9896a8; background: transparent; transition: all 0.15s; letter-spacing: 0.03em; }
  .tag:hover { border-color: #7b6ef6; color: #b0aeff; }
  .tag.active { background: #7b6ef6; border-color: #7b6ef6; color: #fff; }
  .fetch-btn { margin-left: auto; padding: 7px 18px; border-radius: 8px; background: #7b6ef6; border: none; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; letter-spacing: 0.04em; transition: all 0.15s; display: flex; align-items: center; gap: 7px; }
  .fetch-btn:hover { background: #6a5de0; }
  .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rss-section { padding: 0.75rem 2rem; border-bottom: 0.5px solid #1a1828; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rss-label { font-size: 11px; color: #6b6880; letter-spacing: 0.08em; text-transform: uppercase; }
  .rss-chip { font-size: 11px; padding: 3px 9px; border-radius: 6px; background: #141220; border: 0.5px solid #2a2840; color: #9896a8; display: flex; align-items: center; gap: 5px; }
  .rss-chip span { width: 5px; height: 5px; border-radius: 50%; background: #f59e0b; display: inline-block; }
  .add-rss-btn { font-size: 11px; color: #7b6ef6; border: 0.5px dashed #7b6ef6; background: transparent; border-radius: 6px; padding: 3px 9px; cursor: pointer; font-family: inherit; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 1.5rem 2rem; }
  .card { background: #0f0e1a; border: 0.5px solid #1e1c30; border-radius: 12px; padding: 1.1rem 1.25rem; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .card:hover { border-color: #3a3660; transform: translateY(-1px); }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 12px 12px 0 0; }
  .card.science::before { background: linear-gradient(90deg, #4ade80, #7b6ef6); }
  .card.philosophy::before { background: linear-gradient(90deg, #f59e0b, #ec4899); }
  .card.history::before { background: linear-gradient(90deg, #38bdf8, #a78bfa); }
  .card.occult::before { background: linear-gradient(90deg, #a78bfa, #ec4899); }
  .card.mixed::before { background: linear-gradient(90deg, #7b6ef6, #38bdf8); }
  
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 0.6rem; }
  .cat-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; letter-spacing: 0.06em; }
  .cat-badge.science { background: #0a2010; color: #4ade80; border: 0.5px solid #1a4020; }
  .cat-badge.philosophy { background: #201508; color: #f59e0b; border: 0.5px solid #40280a; }
  .cat-badge.history { background: #080f20; color: #38bdf8; border: 0.5px solid #102040; }
  .cat-badge.occult { background: #180820; color: #a78bfa; border: 0.5px solid #301050; }
  .cat-badge.mixed { background: #0c0818; color: #c084fc; border: 0.5px solid #201030; }
  .card-date { font-size: 11px; color: #4a4860; margin-left: auto; }
  .card-source { font-size: 11px; color: #5a5870; }
  .card-title { font-size: 14px; font-weight: 500; color: #d4d0e8; line-height: 1.5; margin-bottom: 0.5rem; }
  .card-summary { font-size: 12px; color: #7a7890; line-height: 1.6; }
  .card-link { font-size: 11px; color: #7b6ef6; margin-top: 0.75rem; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
  .card-link:hover { color: #a89fff; }

  .empty { text-align: center; padding: 4rem 2rem; color: #4a4860; }
  .empty-icon { font-size: 32px; margin-bottom: 1rem; opacity: 0.4; }
  .empty-text { font-size: 14px; margin-bottom: 0.5rem; color: #6b6880; }
  .empty-sub { font-size: 12px; }

  .loading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 1.5rem 2rem; }
  .skeleton { background: #0f0e1a; border: 0.5px solid #1e1c30; border-radius: 12px; padding: 1.1rem 1.25rem; }
  .skel-bar { background: #1e1c30; border-radius: 4px; margin-bottom: 10px; animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0%,100%{opacity:0.5} 50%{opacity:1} }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; padding: 2rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: #0f0e1a; border: 0.5px solid #2a2840; border-radius: 16px; padding: 1.5rem; max-width: 520px; width: 100%; }
  .modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 1rem; color: #d4d0e8; }
  .modal input { width: 100%; padding: 8px 12px; background: #0a0a0f; border: 0.5px solid #2a2840; border-radius: 8px; color: #e8e6f0; font-size: 13px; font-family: inherit; margin-bottom: 10px; }
  .modal input:focus { outline: none; border-color: #7b6ef6; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 0.5rem; }
  .btn-cancel { padding: 7px 14px; background: transparent; border: 0.5px solid #2a2840; border-radius: 8px; color: #9896a8; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-add { padding: 7px 14px; background: #7b6ef6; border: none; border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }

  .error-banner { margin: 1rem 2rem; padding: 0.75rem 1rem; background: #1a0808; border: 0.5px solid #3a1010; border-radius: 8px; color: #f87171; font-size: 13px; }

  .load-more-bar { padding: 0 2rem 2.5rem; display: flex; justify-content: center; }
  .load-more-btn { padding: 9px 32px; border-radius: 8px; background: transparent; border: 0.5px solid #3a3660; color: #9896a8; font-size: 13px; cursor: pointer; font-family: inherit; letter-spacing: 0.04em; transition: all 0.15s; display: flex; align-items: center; gap: 7px; }
  .load-more-btn:hover { border-color: #7b6ef6; color: #b0aeff; }
  .load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .apikey-bar { padding: 0.75rem 2rem; border-bottom: 0.5px solid #1a1828; display: flex; align-items: center; gap: 10px; }
  .apikey-label { font-size: 11px; color: #6b6880; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .apikey-input { flex: 1; max-width: 380px; padding: 5px 10px; background: #0a0a0f; border: 0.5px solid #2a2840; border-radius: 6px; color: #e8e6f0; font-size: 12px; font-family: inherit; }
  .apikey-input:focus { outline: none; border-color: #7b6ef6; }
  .apikey-save { padding: 5px 12px; background: #7b6ef6; border: none; border-radius: 6px; color: #fff; font-size: 12px; cursor: pointer; font-family: inherit; }
  .apikey-status { font-size: 11px; color: #4ade80; }
</style>
</head>
<body>

<header>
  <div class="logo">実在研究所 <span>NEWS</span></div>
  <div class="status-text"><span class="status-dot"></span>科学・哲学 日次フィード</div>
</header>

<div class="controls">
  <div class="tag-filter" id="tagFilter">
    <button class="tag active" data-cat="all">すべて</button>
    <button class="tag" data-cat="science">科学</button>
    <button class="tag" data-cat="philosophy">哲学</button>
    <button class="tag" data-cat="history">科学史</button>
    <button class="tag" data-cat="occult">神秘・オカルト</button>
  </div>
  <button class="fetch-btn" id="fetchBtn" onclick="fetchArticles()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    記事を取得
  </button>
</div>

<div class="apikey-bar">
  <span class="apikey-label">API KEY</span>
  <input type="password" class="apikey-input" id="apikeyInput" placeholder="sk-ant-api03-..." />
  <button class="apikey-save" onclick="saveApiKey()">保存</button>
  <span class="apikey-status" id="apikeyStatus"></span>
</div>

<div class="rss-section">
  <span class="rss-label">RSS</span>
  <div id="rssChips"></div>
  <button class="add-rss-btn" onclick="openModal()">+ 追加</button>
</div>

<div id="errorBanner" style="display:none" class="error-banner"></div>
<div id="content"></div>
<div class="load-more-bar" id="loadMoreBar" style="display:none">
  <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreArticles()">さらに表示</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>RSSフィードを追加</h3>
    <input type="text" id="rssUrl" placeholder="https://example.com/feed.xml" />
    <input type="text" id="rssName" placeholder="サイト名（例: NHK科学）" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-add" onclick="addRss()">追加</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_RSS = [
  { name: 'NHK科学文化', url: 'https://www3.nhk.or.jp/rss/news/cat3.xml' },
  { name: '朝日科学', url: 'https://www.asahi.com/rss/science.rdf' },
  { name: 'ナショジオ', url: 'https://natgeo.nikkeibp.co.jp/rss/news.rdf' },
];

let rssFeeds = [...DEFAULT_RSS];
let articles = [];
let activeFilter = 'all';
let loading = false;

function setLoadMoreVisible(visible) {
  document.getElementById('loadMoreBar').style.display = visible ? 'flex' : 'none';
}

function saveApiKey() {
  const key = document.getElementById('apikeyInput').value.trim();
  if (!key) return;
  localStorage.setItem('anthropic_api_key', key);
  document.getElementById('apikeyStatus').textContent = '✓ 保存済み';
  setTimeout(() => { document.getElementById('apikeyStatus').textContent = ''; }, 2000);
}

function loadApiKey() {
  const key = localStorage.getItem('anthropic_api_key') || '';
  if (key) {
    document.getElementById('apikeyInput').value = key;
    document.getElementById('apikeyStatus').textContent = '✓ 保存済み';
  }
  return key;
}

function renderRssChips() {
  const el = document.getElementById('rssChips');
  el.innerHTML = rssFeeds.map(f => `<div class="rss-chip"><span></span>${f.name}</div>`).join('');
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('rssUrl').value=''; document.getElementById('rssName').value=''; }

function addRss() {
  const url = document.getElementById('rssUrl').value.trim();
  const name = document.getElementById('rssName').value.trim() || 'カスタムフィード';
  if (!url) return;
  rssFeeds.push({ name, url });
  renderRssChips();
  closeModal();
}

document.getElementById('tagFilter').addEventListener('click', e => {
  const btn = e.target.closest('.tag');
  if (!btn) return;
  activeFilter = btn.dataset.cat;
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
});

function getCatLabel(cat) {
  return { science:'科学', philosophy:'哲学', history:'科学史', occult:'神秘・オカルト', mixed:'複合' }[cat] || cat;
}

function renderCards() {
  const filtered = activeFilter === 'all' ? articles : articles.filter(a => a.category === activeFilter);
  const el = document.getElementById('content');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">◎</div><div class="empty-text">記事がありません</div><div class="empty-sub">「記事を取得」ボタンで最新記事を検索します</div></div>`;
    return;
  }
  el.innerHTML = `<div class="grid">${filtered.map(a => `
    <div class="card ${a.category}">
      <div class="card-meta">
        <span class="cat-badge ${a.category}">${getCatLabel(a.category)}</span>
        <span class="card-source">${a.source}</span>
        <span class="card-date">${a.date}</span>
      </div>
      <div class="card-title">${a.title}</div>
      <div class="card-summary">${a.summary}</div>
      ${a.url ? `<a class="card-link" href="${a.url}" target="_blank">記事を読む →</a>` : ''}
    </div>
  `).join('')}</div>`;
}

const SKELETON_HTML = `<div class="loading-grid">${[...Array(6)].map(()=>`
    <div class="skeleton">
      <div class="skel-bar" style="height:14px;width:60%"></div>
      <div class="skel-bar" style="height:16px;width:90%"></div>
      <div class="skel-bar" style="height:12px;width:80%"></div>
      <div class="skel-bar" style="height:12px;width:70%"></div>
    </div>
  `).join('')}</div>`;

function showSkeleton() {
  document.getElementById('content').innerHTML = SKELETON_HTML;
}

function buildPrompt(excludeTitles = []) {
  const today = new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' });
  const excludeNote = excludeTitles.length
    ? `\n\n以下の記事はすでに表示済みです。重複しないよう別の記事を選んでください：\n${excludeTitles.map(t => `- ${t}`).join('\n')}`
    : '';
  return `あなたは科学・哲学・科学史・神秘思想の日本語記事キュレーターです。

今日（${today}）の科学・哲学・科学史・神秘/オカルト関連の最新日本語ニュースや記事を10件探してください。

対象カテゴリ:
- science（科学・宇宙・生命科学・AI・物理・数学）
- philosophy（哲学・倫理・思想・認知科学）
- history（科学史・思想史・文明史）
- occult（神秘主義・錬金術・オカルト・宗教思想・ニューエイジ）
- mixed（複数カテゴリにまたがる）${excludeNote}

以下のJSON形式のみで返答してください（他のテキスト不要）：
{
  "articles": [
    {
      "title": "記事タイトル",
      "summary": "80文字程度の要約",
      "category": "science|philosophy|history|occult|mixed",
      "source": "媒体名",
      "date": "YYYY/MM/DD",
      "url": "記事URL（不明な場合は空文字）"
    }
  ]
}`;
}

async function callAPI(prompt, apiKey) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-5',
      max_tokens: 4000,
      system: '必ずJSON形式のみで返答してください。説明文・マークダウン・コードブロック記号は一切不要です。返答の最初の文字は { でなければなりません。',
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || `API error (${res.status})`);
  const textBlock = data.content?.find(b => b.type === 'text');
  if (!textBlock) throw new Error(`テキスト応答がありません (stop_reason: ${data.stop_reason})`);
  const raw = textBlock.text.trim();
  const stripped = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const jsonMatch = stripped.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error(`記事データのパースに失敗しました\n---\n${raw.slice(0, 300)}`);
  const parsed = JSON.parse(jsonMatch[0]);
  return parsed.articles || [];
}

function getApiKeyOrShowError() {
  const apiKey = loadApiKey();
  if (!apiKey) {
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('errorBanner').textContent = 'エラー: APIキーが未設定です。上の「API KEY」欄にAnthropicのAPIキーを入力して「保存」してください。';
  }
  return apiKey;
}

async function fetchArticles() {
  if (loading) return;
  loading = true;
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spin">↻</span> 取得中...`;
  document.getElementById('errorBanner').style.display = 'none';
  setLoadMoreVisible(false);
  showSkeleton();

  const apiKey = getApiKeyOrShowError();
  if (!apiKey) {
    document.getElementById('content').innerHTML = `<div class="empty"><div class="empty-icon">◎</div><div class="empty-text">APIキーを設定してください</div></div>`;
    loading = false;
    btn.disabled = false;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 記事を取得`;
    return;
  }

  try {
    articles = await callAPI(buildPrompt(), apiKey);
    renderCards();
    setLoadMoreVisible(articles.length > 0);
  } catch (err) {
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('errorBanner').textContent = 'エラー: ' + err.message;
    document.getElementById('content').innerHTML = `<div class="empty"><div class="empty-icon">◎</div><div class="empty-text">取得に失敗しました</div><div class="empty-sub">もう一度お試しください</div></div>`;
  } finally {
    loading = false;
    btn.disabled = false;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 記事を取得`;
  }
}

async function loadMoreArticles() {
  if (loading) return;
  loading = true;
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spin">↻</span> 読み込み中...`;
  document.getElementById('errorBanner').style.display = 'none';

  const apiKey = getApiKeyOrShowError();
  if (!apiKey) {
    loading = false;
    btn.disabled = false;
    btn.innerHTML = 'さらに表示';
    return;
  }

  try {
    const excludeTitles = articles.map(a => a.title);
    const newArticles = await callAPI(buildPrompt(excludeTitles), apiKey);
    articles = articles.concat(newArticles);
    renderCards();
  } catch (err) {
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('errorBanner').textContent = 'エラー: ' + err.message;
  } finally {
    loading = false;
    btn.disabled = false;
    btn.innerHTML = 'さらに表示';
  }
}

renderRssChips();
loadApiKey();
document.getElementById('content').innerHTML = `<div class="empty"><div class="empty-icon">◎</div><div class="empty-text">「記事を取得」で今日のフィードを読み込みます</div><div class="empty-sub">Claude Web検索 + RSSフィード</div></div>`;
</script>
</body>
</html>
